<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Visual Workbook</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Animation Styles to match shadcn/ui behavior -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInFromBottom {
            from { transform: translateY(1rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .animate-in {
            animation-duration: 0.5s;
            animation-fill-mode: both;
            animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fade-in {
            animation-name: fadeIn;
        }
        
        .slide-in-from-bottom-4 {
            animation-name: slideInFromBottom;
        }
        
        .zoom-in {
            animation-name: zoomIn;
        }
        
        /* Comic Sans font for student voice */
        .font-comic {
            font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Icons (Replaced lucide-react with inline SVGs for portability) ---
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const ArrowRight = ({ className }) => <IconWrapper className={className}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconWrapper>;
        const AlertTriangle = ({ className }) => <IconWrapper className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></IconWrapper>;
        const DollarSign = ({ className }) => <IconWrapper className={className}><line x1="12" x2="12" y1="2" y2="22" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></IconWrapper>;
        const CheckCircle = ({ className }) => <IconWrapper className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconWrapper>;
        const Calculator = ({ className }) => <IconWrapper className={className}><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></IconWrapper>;
        const Briefcase = ({ className }) => <IconWrapper className={className}><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></IconWrapper>;
        const Calendar = ({ className }) => <IconWrapper className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>;
        const User = ({ className }) => <IconWrapper className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconWrapper>;
        const ChevronLeft = ({ className }) => <IconWrapper className={className}><path d="m15 18-6-6 6-6" /></IconWrapper>;
        const ChevronRight = ({ className }) => <IconWrapper className={className}><path d="m9 18 6-6-6-6" /></IconWrapper>;

        const ProjectWorkbook = () => {
          const [currentActivity, setCurrentActivity] = useState(0);

          // Activity C State
          const [impactInput, setImpactInput] = useState("");
          const [lessonInput, setLessonInput] = useState("");
          const [cFeedback, setCFeedback] = useState(false);

          // Activity D State
          const [showCalculation, setShowCalculation] = useState(false);
          const [showSentence, setShowSentence] = useState(false);

          // Activity E State
          const [addedDelay, setAddedDelay] = useState(0);

          // Activity F State
          const [managerInput, setManagerInput] = useState("");
          const [fFeedback, setFFeedback] = useState(false);

          const totalActivities = 4;

          const nextActivity = () => {
            if (currentActivity < totalActivities - 1) setCurrentActivity(currentActivity + 1);
          };

          const prevActivity = () => {
            if (currentActivity > 0) setCurrentActivity(currentActivity - 1);
          };

          // --- Components ---

          const ProgressBar = () => (
            <div className="w-full bg-gray-200 h-4 rounded-full mb-6">
              <div 
                className="bg-blue-600 h-4 rounded-full transition-all duration-500 ease-in-out"
                style={{ width: `${((currentActivity + 1) / totalActivities) * 100}%` }}
              ></div>
            </div>
          );

          const ActivityC = () => (
            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4">
              <div className="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-lg">
                <h2 className="text-2xl font-bold text-blue-800 flex items-center gap-2">
                  <AlertTriangle className="w-6 h-6" /> Activity C: The "So What?" Method
                </h2>
                <p className="text-blue-700 mt-2 text-lg">Goal: Don't just describe what happened. Explain the <strong>impact</strong> and the <strong>lesson</strong>.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {/* Step 1: Issue */}
                <div className="bg-red-50 p-6 rounded-xl border-2 border-red-200 shadow-sm">
                  <div className="flex justify-between items-center mb-4">
                    <span className="bg-red-200 text-red-800 px-3 py-1 rounded-full font-bold text-sm">STEP 1</span>
                    <AlertTriangle className="text-red-500" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-800 mb-2">The Issue</h3>
                  <p className="text-gray-600 italic">"Software problems occurred due to rushing."</p>
                  <div className="mt-4 text-sm text-gray-500 font-medium">⚠ Already Identified</div>
                </div>

                {/* Step 2: Impact */}
                <div className="bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 shadow-sm relative">
                   <div className="absolute -left-3 top-1/2 transform -translate-y-1/2 hidden md:block">
                    <ArrowRight className="text-gray-400 w-8 h-8" />
                  </div>
                  <div className="flex justify-between items-center mb-4">
                    <span className="bg-yellow-200 text-yellow-800 px-3 py-1 rounded-full font-bold text-sm">STEP 2</span>
                    <DollarSign className="text-yellow-600" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-800 mb-2">The Impact</h3>
                  <label className="block text-sm text-gray-600 mb-2">How did this hurt Time or Money?</label>
                  <textarea 
                    className="w-full p-3 border-2 border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                    rows="3"
                    placeholder="It cost extra money because..."
                    value={impactInput}
                    onChange={(e) => setImpactInput(e.target.value)}
                  />
                </div>

                {/* Step 3: Lesson */}
                <div className="bg-green-50 p-6 rounded-xl border-2 border-green-200 shadow-sm relative">
                  <div className="absolute -left-3 top-1/2 transform -translate-y-1/2 hidden md:block">
                    <ArrowRight className="text-gray-400 w-8 h-8" />
                  </div>
                  <div className="flex justify-between items-center mb-4">
                    <span className="bg-green-200 text-green-800 px-3 py-1 rounded-full font-bold text-sm">STEP 3</span>
                    <CheckCircle className="text-green-600" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-800 mb-2">The Lesson</h3>
                  <label className="block text-sm text-gray-600 mb-2">Distinction Rule: Be specific!</label>
                  <textarea 
                    className="w-full p-3 border-2 border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    rows="3"
                    placeholder="In the future, I will..."
                    value={lessonInput}
                    onChange={(e) => setLessonInput(e.target.value)}
                  />
                </div>
              </div>

              <div className="flex justify-end">
                <button 
                  onClick={() => setCFeedback(true)}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition active:scale-95 flex items-center gap-2"
                >
                  Check My Logic <ArrowRight className="w-5 h-5" />
                </button>
              </div>

              {cFeedback && (
                <div className="bg-indigo-100 p-4 rounded-lg border border-indigo-300 animate-in zoom-in">
                  <h4 className="font-bold text-indigo-800 text-lg mb-2">LSA Feedback:</h4>
                  <p className="text-indigo-700">
                    <strong>Impact Check:</strong> Did you mention that it wasted budget on regression testing? <br/>
                    <strong>Lesson Check:</strong> Did you use words like "Time Management" or "Quality Control"? <br/>
                    <em>Distinction Hint: "If you were the boss tomorrow, what new rule would you make?"</em>
                  </p>
                </div>
              )}
            </div>
          );

          const ActivityD = () => (
            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4">
              <div className="bg-purple-50 border-l-4 border-purple-600 p-4 rounded-r-lg">
                <h2 className="text-2xl font-bold text-purple-800 flex items-center gap-2">
                  <Calculator className="w-6 h-6" /> Activity D: The "Cost of Chaos"
                </h2>
                <p className="text-purple-700 mt-2 text-lg">Goal: Calculate exactly how expensive the problem was.</p>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h3 className="text-lg font-semibold text-gray-700 mb-4">The Ingredients for the Calculation:</h3>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                  <div className="bg-gray-100 p-4 rounded-lg text-center">
                    <div className="text-2xl font-bold text-gray-800">5 Days</div>
                    <div className="text-sm text-gray-500">Time needed to fix</div>
                  </div>
                  <div className="flex justify-center items-center text-gray-400 font-bold text-xl">X</div>
                  <div className="bg-gray-100 p-4 rounded-lg text-center">
                    <div className="text-2xl font-bold text-gray-800">7.5 Hours</div>
                    <div className="text-sm text-gray-500">Hours in a work day</div>
                  </div>
                </div>

                {!showCalculation ? (
                  <button 
                    onClick={() => setShowCalculation(true)}
                    className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow-md transition-all"
                  >
                    Calculate Total Hours Wasted
                  </button>
                ) : (
                  <div className="space-y-6 animate-in fade-in">
                    <div className="text-center bg-purple-100 p-4 rounded-lg border-2 border-purple-300">
                      <span className="text-3xl font-bold text-purple-800">37.5 Hours Wasted</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center mt-4">
                      <div className="bg-gray-100 p-4 rounded-lg text-center opacity-75">
                        <div className="text-xl font-bold text-gray-800">37.5 Hours</div>
                      </div>
                      <div className="flex justify-center items-center text-gray-400 font-bold text-xl">X</div>
                      <div className="bg-gray-100 p-4 rounded-lg text-center">
                        <div className="text-xl font-bold text-gray-800">£35.00</div>
                        <div className="text-sm text-gray-500">Rate per hour</div>
                      </div>
                    </div>

                    <div className="text-center p-6 bg-red-100 rounded-xl border-4 border-red-300 mt-4">
                      <div className="text-sm font-bold text-red-600 uppercase tracking-widest mb-1">Total Cost of Fault</div>
                      <div className="text-5xl font-black text-red-800">£1,312.50</div>
                    </div>

                    <button 
                      onClick={() => setShowSentence(true)}
                      className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg shadow-md transition-all flex items-center justify-center gap-2 mt-4"
                    >
                      <Briefcase className="w-5 h-5" /> Generate Distinction Justification
                    </button>

                    {showSentence && (
                      <div className="bg-blue-50 p-6 rounded-lg border-l-4 border-blue-500 italic text-blue-800 text-lg leading-relaxed mt-4 animate-in fade-in">
                        "The budget overspend was justified because rectifying the major software fault cost the project an additional <strong>£1312.50</strong>, which was necessary to ensure patient safety."
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );

          const ActivityE = () => (
            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4">
              <div className="bg-orange-50 border-l-4 border-orange-600 p-4 rounded-r-lg">
                <h2 className="text-2xl font-bold text-orange-800 flex items-center gap-2">
                  <Calendar className="w-6 h-6" /> Activity E: The "Domino Effect" Timeline
                </h2>
                <p className="text-orange-700 mt-2 text-lg">Goal: Visually map the knock-on effect of delays.</p>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <div className="flex flex-col md:flex-row gap-8 mb-8">
                  <div className="flex-1">
                    <h3 className="font-bold text-gray-700 mb-2">1. The Trigger</h3>
                    <div className="bg-red-100 p-3 rounded text-red-800 border border-red-200">
                      Senior Engineer caused a <strong>5-day delay</strong>.
                    </div>
                  </div>
                  <div className="flex items-center justify-center">
                    <ArrowRight className="text-gray-400 w-8 h-8 hidden md:block" />
                    <ArrowRight className="text-gray-400 w-8 h-8 md:hidden rotate-90" />
                  </div>
                  <div className="flex-1">
                    <h3 className="font-bold text-gray-700 mb-2">2. The Consequence</h3>
                    <div className="bg-orange-100 p-3 rounded text-orange-800 border border-orange-200">
                      Config problems caused <strong>3 more days</strong>.
                    </div>
                  </div>
                </div>

                <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                  <h3 className="text-lg font-bold text-gray-800 mb-4 text-center">Interactive Timeline</h3>
                  
                  <div className="flex flex-col items-center">
                    <div className="w-full flex items-center justify-between mb-2">
                      <span className="text-gray-500 font-medium">Original Finish: Mar 11</span>
                      <span className="text-blue-600 font-bold">New Finish Date: {addedDelay > 0 ? `+ ${addedDelay} Working Days` : 'Mar 11'}</span>
                    </div>
                    
                    <div className="w-full h-12 bg-gray-200 rounded-full relative overflow-hidden flex items-center px-2">
                      {/* Base Timeline */}
                      <div className="h-full w-full absolute left-0 top-0 bg-gray-200"></div>
                      
                      {/* Delay Blocks */}
                      <div 
                        className="h-8 bg-red-500 rounded-l-md transition-all duration-500 relative z-10 flex items-center justify-center text-white font-bold text-xs"
                        style={{ width: `${(addedDelay / 15) * 100}%` }}
                      >
                        {addedDelay > 0 ? `${addedDelay} Days` : ''}
                      </div>
                    </div>

                    <div className="flex gap-4 mt-6">
                      <button 
                        onClick={() => setAddedDelay(5)}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${addedDelay === 5 ? 'bg-red-600 text-white ring-2 ring-red-300' : 'bg-white border-2 border-red-200 text-red-600 hover:bg-red-50'}`}
                      >
                        + Add Engineer Delay (5)
                      </button>
                      <button 
                        onClick={() => setAddedDelay(8)}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${addedDelay === 8 ? 'bg-orange-600 text-white ring-2 ring-orange-300' : 'bg-white border-2 border-orange-200 text-orange-600 hover:bg-orange-50'}`}
                      >
                        + Add Config Delay (3)
                      </button>
                       <button 
                        onClick={() => setAddedDelay(0)}
                        className="px-4 py-2 rounded-lg font-bold bg-gray-200 text-gray-600 hover:bg-gray-300"
                      >
                        Reset
                      </button>
                    </div>
                  </div>
                  
                  {addedDelay === 8 && (
                     <div className="mt-6 p-4 bg-blue-100 text-blue-800 rounded-lg animate-in zoom-in">
                        <strong>New Finish Date Calculation:</strong><br/>
                        Friday March 11th + 8 Working Days = <span className="text-xl font-bold">Wednesday March 23rd</span>
                     </div>
                  )}
                </div>
                
                <div className="mt-6 bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                   <h4 className="font-bold text-yellow-800 flex items-center gap-2">
                     <User className="w-5 h-5"/> Distinction Question
                   </h4>
                   <p className="text-sm text-yellow-700 mt-1">Why couldn't the Junior Engineer cover for the Senior Engineer? (Check the Org Chart - different skills?)</p>
                </div>
              </div>
            </div>
          );

          const ActivityF = () => (
            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4">
              <div className="bg-teal-50 border-l-4 border-teal-600 p-4 rounded-r-lg">
                <h2 className="text-2xl font-bold text-teal-800 flex items-center gap-2">
                  <Briefcase className="w-6 h-6" /> Activity F: Professional Translator
                </h2>
                <p className="text-teal-700 mt-2 text-lg">Goal: Rewrite "Student Voice" into "Project Manager Voice".</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {/* Example 1 */}
                <div className="bg-gray-100 p-5 rounded-lg border border-gray-300 opacity-75">
                  <div className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Student Voice</div>
                  <p className="font-comic text-gray-700 text-lg">"The app is good and works well now."</p>
                </div>
                <div className="bg-teal-50 p-5 rounded-lg border border-teal-300 shadow-sm">
                  <div className="text-xs font-bold text-teal-600 uppercase tracking-wide mb-2">Project Manager Voice</div>
                  <p className="font-serif font-medium text-teal-900 text-lg">"The deliverables were successfully met, ensuring high functionality."</p>
                </div>

                {/* Interactive Task */}
                <div className="bg-gray-100 p-5 rounded-lg border border-gray-300 opacity-75 flex flex-col justify-center">
                  <div className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Student Voice</div>
                  <p className="font-comic text-gray-700 text-lg">"We spent too much money."</p>
                </div>

                <div className="bg-white p-5 rounded-lg border-2 border-teal-500 shadow-lg relative">
                  <div className="text-xs font-bold text-teal-600 uppercase tracking-wide mb-2">Your Turn (Manager Voice)</div>
                  {!fFeedback ? (
                    <>
                      <textarea 
                        className="w-full p-3 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-teal-500 mb-3"
                        rows="3"
                        placeholder="Try using the word 'Budget'..."
                        value={managerInput}
                        onChange={(e) => setManagerInput(e.target.value)}
                      />
                      <button 
                        onClick={() => setFFeedback(true)}
                        className="w-full bg-teal-600 text-white font-bold py-2 rounded hover:bg-teal-700 transition"
                      >
                        Reveal Professional Version
                      </button>
                    </>
                  ) : (
                    <div className="animate-in fade-in">
                        <p className="font-serif font-medium text-teal-900 text-lg mb-3">
                        "The project encountered a <strong>budget overrun</strong> due to the requirement for additional regression testing."
                        </p>
                        <button 
                            onClick={() => setFFeedback(false)}
                            className="text-sm text-teal-600 underline"
                        >
                            Try again
                        </button>
                    </div>
                  )}
                </div>
              </div>

               <div className="bg-blue-50 p-4 rounded-lg mt-4 border border-blue-200">
                <h3 className="font-bold text-blue-800 mb-2">Sentence Starter Pack:</h3>
                <ul className="list-disc list-inside text-blue-700 space-y-1">
                    <li>"Although the project was delivered..."</li>
                    <li>"The decision to prioritize quality resulted in..."</li>
                    <li>"A key lesson for future projects is..."</li>
                </ul>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-gray-800">
              <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden min-h-[600px] flex flex-col">
                
                {/* Header */}
                <div className="bg-slate-900 text-white p-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl md:text-3xl font-bold">Lessons Learned Workshop</h1>
                      <p className="text-slate-400 text-sm md:text-base mt-1">Distinction Level Preparation</p>
                    </div>
                    <div className="text-right hidden md:block">
                      <div className="text-xs uppercase tracking-widest text-slate-500">Duration</div>
                      <div className="font-mono text-xl text-yellow-400">45 Mins</div>
                    </div>
                  </div>
                </div>

                {/* Content Area */}
                <div className="flex-1 p-6 md:p-8">
                  <ProgressBar />
                  
                  {currentActivity === 0 && <ActivityC />}
                  {currentActivity === 1 && <ActivityD />}
                  {currentActivity === 2 && <ActivityE />}
                  {currentActivity === 3 && <ActivityF />}
                </div>

                {/* Footer Navigation */}
                <div className="bg-gray-100 p-6 border-t border-gray-200 flex justify-between items-center">
                  <button 
                    onClick={prevActivity}
                    disabled={currentActivity === 0}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold transition-all ${currentActivity === 0 ? 'text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 shadow-sm hover:shadow-md hover:bg-gray-50'}`}
                  >
                    <ChevronLeft className="w-5 h-5" /> Previous
                  </button>

                  <div className="text-gray-500 font-medium">
                    Step {currentActivity + 1} of {totalActivities}
                  </div>

                  <button 
                    onClick={nextActivity}
                    disabled={currentActivity === totalActivities - 1}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold transition-all ${currentActivity === totalActivities - 1 ? 'text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white shadow-md hover:shadow-lg hover:bg-blue-700'}`}
                  >
                    Next Activity <ChevronRight className="w-5 h-5" />
                  </button>
                </div>

              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProjectWorkbook />);
    </script>
</body>
</html>
